<!DOCTYPE html>
<html>
<head>
    <title>Ajouter une personne</title>
</head>
<body>
    <h1>Ajouter une nouvelle personne</h1>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <div>
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="mail" required><br><br>
        </div>
        <div>
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" required><br><br>
        </div>
        <div>
            <label for="prenom">Prénom:</label>
            <input type="text" id="prenom" name="prenom" required><br><br>
        </div>
        <div>
            <label for="date_naissance">Date de naissance (AAAA-MM-JJ):</label>
            <input type="text" id="date_naissance" name="date_naissance" placeholder="AAAA-MM-JJ" required><br><br>
        </div>
        <div>
            <label for="sexe">Sexe:</label>
            <select id="sexe" name="sexe" required>
                <option value="M">Homme</option>
                <option value="F">Femme</option>
                <option value="X">Autre</option>
            </select><br><br>
        </div>
        <button type="submit">Ajouter</button>
    </form>
    <p><a href="{{ url_for('personne.ajouter_personne') }}">Rafraîchir le formulaire</a></p>
</body>
</html>
